{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <title>Attempt Limit Reached - {{ quiz.title }}</title>
</head>
<body>

    <div class="topbar">
        <a class="brand" href="/quizzes/">Placement<span>Prep</span></a>
        <nav>
            <a href="/admin/logout/">Logout</a>
        </nav>
    </div>

    <div class="container">

        <h1>Attempt Limit Reached</h1>

        <div class="card">
            <p>
                You have used all {{ quiz.max_attempts }} allowed attempt(s) for
                <strong>"{{ quiz.title }}"</strong>. No further attempts are available.
            </p>

            <a class="btn" href="/quizzes/">Back to Quizzes</a>
        </div>

    </div>

</body>
</html>
