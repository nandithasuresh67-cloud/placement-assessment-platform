{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <title>{{ mode }} Category - Placement Assessment Platform</title>
</head>
<body>

    <div class="topbar">
        <a class="brand" href="/dashboard/">Placement<span>Prep</span> Admin</a>
        <nav>
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="{% url 'admin_quiz_list' %}">Quizzes</a>
            <a href="/admin/logout/">Logout</a>
        </nav>
    </div>

    <div class="container">

        <h1>{{ mode }} Category</h1>
        <p class="subtitle"><a class="link" href="{% url 'admin_category_list' %}">&larr; Back to Category List</a></p>

        <div class="card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-accent">Save</button>
            </form>
        </div>

    </div>

</body>
</html>
