{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <title>Delete Quiz - Placement Assessment Platform</title>
</head>
<body>

    <div class="topbar">
        <a class="brand" href="/dashboard/">Placement<span>Prep</span> Admin</a>
        <nav>
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="/admin/logout/">Logout</a>
        </nav>
    </div>

    <div class="container">

        <h1>Delete Quiz</h1>

        <div class="card">
            <p>Are you sure you want to delete <strong>"{{ quiz.title }}"</strong>? This cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a class="btn btn-secondary" href="{% url 'admin_quiz_list' %}">Cancel</a>
            </form>
        </div>

    </div>

</body>
</html>
